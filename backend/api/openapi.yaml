openapi: 3.0.3
info:
  title: Consul API
  version: 1.0.0
  description: |
    AI financial advisor for SMEs in Uzbekistan. The LLM never calculates numbers itself:
    it calls the deterministic calculators below through tool calling.

    **Auth**: `access_token` (15 min) and `refresh_token` (14 days) are set as
    `HttpOnly; Secure; SameSite=Strict` cookies. Browsers just send them (`credentials: "include"`).
    On `401` call `POST /auth/refresh` and retry. API tools may use `Authorization: Bearer <access_token>`.

    **Errors** always look like `{"error": {"code": "...", "message": "..."}}`.

    Calculations are informational and are **not tax, legal or credit advice**.
servers: [{url: /api/v1, description: API version 1 — all paths below are relative to it}]
tags:
  - {name: auth}
  - {name: user}
  - {name: calculator}
  - {name: advisor}
  - {name: vision, description: Document photo recognition (multimodal LLM)}
  - {name: ledger, description: "Bookkeeping: operations, debtors, obligations, the Today screen"}
  - {name: consul, description: "Chat with Consul, grounded in the user's ledger"}
  - {name: voice, description: Speech to text and text to speech (VoiceLab)}
  - {name: palata, description: Anonymous statistics for the Chamber of Commerce}
security: [{cookieAuth: []}, {bearerAuth: []}]

paths:
  /auth/register:
    post:
      tags: [auth]
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Credentials'}}}}
      responses:
        '201': {$ref: '#/components/responses/Auth'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [auth]
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Credentials'}}}}
      responses:
        '200': {$ref: '#/components/responses/Auth'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {description: Too many attempts (nginx rate limit)}
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      description: Uses the `refresh_token` cookie. The old refresh token is revoked (rotation); reusing it returns 401.
      responses:
        '200': {$ref: '#/components/responses/Auth'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [auth]
      security: []
      description: Blacklists the refresh token in Redis and clears both cookies.
      responses: {'204': {description: Logged out}}

  /me:
    get:
      tags: [user]
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '401': {$ref: '#/components/responses/Error'}
    patch:
      tags: [user]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {lang: {$ref: '#/components/schemas/Lang'}, prefs: {$ref: '#/components/schemas/Prefs'}}}}}}
      responses: {'200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}}
  /me/consent:
    post:
      tags: [user]
      description: Consent to personal data processing. Required before AI generation.
      responses: {'200': {description: Profile with consent_at set, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}}
    delete:
      tags: [user]
      responses: {'200': {description: Consent withdrawn, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}}
  /me/stats:
    get:
      tags: [user]
      description: Dashboard aggregates (JOIN + FILTER + LIMIT/OFFSET query).
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: {type: string}
                  total_plans: {type: integer}
                  total_calculations: {type: integer}
                  large_loans_calculated: {type: integer, description: Loans above 1 000 000 UZS}
                  recent_plans:
                    type: array
                    items: {type: object, properties: {id: {type: string, format: uuid}, title: {type: string}, created_at: {type: string, format: date-time}}}

  /calculator/calculate:
    post:
      tags: [calculator]
      summary: Loan calculator (annuity / differentiated)
      security: [{}, {cookieAuth: []}]
      description: Public. If the user is logged in, the calculation is saved to history.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoanInput'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/LoanEnvelope'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /calculator/tax:
    post:
      tags: [calculator]
      summary: Uzbekistan tax calculator (turnover vs general regime)
      security: [{}, {cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaxInput'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/TaxEnvelope'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /calculator/breakeven:
    post:
      tags: [calculator]
      summary: Break-even, payback and ROI
      security: [{}, {cookieAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BreakevenInput'}}}}
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/BreakevenEnvelope'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /calculator/rules:
    get:
      tags: [calculator]
      summary: Current tax rates with legal references (lex.uz, soliq.uz)
      security: []
      responses: {'200': {description: Rules, content: {application/json: {schema: {type: object}}}}}
  /calculator/history:
    get:
      tags: [calculator]
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [loan, tax, breakeven]}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: History, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {type: object, properties: {id: {type: string}, kind: {type: string}, input: {type: object}, result: {type: object}, created_at: {type: string, format: date-time}}}
                  limit: {type: integer}
                  offset: {type: integer}

  /advisor/generate:
    post:
      tags: [advisor]
      summary: Generate a business plan (LLM + calculator tools)
      description: |
        Requires consent (`POST /me/consent`). Personal data in free text is masked before
        it is sent to the LLM. Takes 20–90 s. Daily per-user limit (Free tier).
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GenerateInput'}}}}
      responses:
        '201': {description: Plan, content: {application/json: {schema: {$ref: '#/components/schemas/Plan'}}}}
        '403': {description: consent_required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/Error'}
        '429': {description: rate_limited, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: llm_error / llm_no_tools, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: llm_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /advisor/plans:
    get:
      tags: [advisor]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200':
          description: Plan headers, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object, properties: {id: {type: string}, title: {type: string}, lang: {type: string}, created_at: {type: string, format: date-time}}}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
  /advisor/plans/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [advisor]
      responses:
        '200': {description: Plan, content: {application/json: {schema: {$ref: '#/components/schemas/Plan'}}}}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [advisor]
      responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/Error'}}

  /photo:
    post:
      tags: [vision]
      summary: Recognize a photo of a document
      description: |
        Upload a photo or scan (JPEG, PNG or WebP, up to 10 MB). Returns the full transcription in the
        original language plus key fields, document type and a short summary in `lang`.
        Requires consent (`POST /me/consent`): documents contain personal data. The image is
        processed in memory and never stored. Daily per-user limit. Usually takes 5–30 s.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: "JPEG, PNG or WebP, max 10 MB"}
                lang: {$ref: '#/components/schemas/Lang'}
            encoding:
              file: {contentType: 'image/jpeg, image/png, image/webp'}
      responses:
        '200': {description: Recognized document, content: {application/json: {schema: {$ref: '#/components/schemas/PhotoResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: consent_required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: too_large (over 10 MB), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: unsupported_media_type, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: unreadable — the model could not read the image, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: rate_limited, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: llm_error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: llm_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /auth/otp/send:
    post:
      tags: [auth]
      security: []
      summary: Send a one-time login code by SMS
      description: |
        Phone is normalized to +998XXXXXXXXX. At most 3 codes per 10 minutes per phone and per IP.
        In APP_ENV=demo the code is fixed (DEMO_OTP) and no SMS is sent.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [phone], properties: {phone: {type: string, example: "+998901234567"}}}}}}
      responses:
        '204': {description: Code sent}
        '422': {description: invalid_phone, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: otp_rate_limited, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      summary: Verify the code, log in (creates the user on first login)
      description: Sets access/refresh cookies. 3 wrong codes block the phone for 10 minutes.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [phone, code], properties: {phone: {type: string}, code: {type: string, example: "123456"}}}}}}
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: {type: object, required: [user, is_new], properties: {user: {$ref: '#/components/schemas/Profile'}, is_new: {type: boolean}}}
        '401': {description: invalid_code, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: invalid_phone, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: otp_locked, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /auth/demo:
    post:
      tags: [auth]
      security: []
      summary: Log into the demo account (Dilnoza) and reset its data to the reference ledger
      description: Only when the server runs with APP_ENV=demo; otherwise 404.
      responses:
        '200': {description: Logged in, content: {application/json: {schema: {type: object, properties: {user: {$ref: '#/components/schemas/Profile'}}}}}}
        '404': {$ref: '#/components/responses/Error'}

  /me/business:
    put:
      tags: [user]
      summary: Create or replace the business profile (onboarding, "Me → Business")
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Business'}}}}
      responses:
        '200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /me/consent/stats:
    post:
      tags: [user]
      summary: Voluntary consent to anonymous statistics for the Chamber of Commerce
      responses: {'200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}}
    delete:
      tags: [user]
      summary: Withdraw the statistics consent (excluded from the next snapshots)
      responses: {'200': {description: Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}}

  /ledger/today:
    get:
      tags: [ledger]
      summary: The "Today" screen — what can be spent, upcoming payments, attention, 30-day forecast, month
      responses:
        '200': {description: Today, content: {application/json: {schema: {$ref: '#/components/schemas/Today'}}}}
  /ops/parse:
    post:
      tags: [ledger]
      summary: Understand a typed/spoken phrase without writing anything (deterministic parser, no LLM)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string, example: "bugun 1,2 mln sotdim", maxLength: 500}}}}}}
      responses:
        '200': {description: Intent, content: {application/json: {schema: {$ref: '#/components/schemas/Intent'}}}}
  /ops:
    get:
      tags: [ledger]
      summary: Operations, newest first, cursor pagination
      parameters:
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/OpKind'}}
        - {name: from, in: query, schema: {type: string, format: date}, description: "inclusive, Asia/Tashkent"}
        - {name: to, in: query, schema: {type: string, format: date}, description: "inclusive, Asia/Tashkent"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Op'}}, next_cursor: {type: string, nullable: true}}}
    post:
      tags: [ledger]
      summary: Record an operation (after the user confirmed it)
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 100}, description: "A repeat with the same key returns the first response"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OpInput'}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/OpResult'}}}}
        '200': {description: Idempotent repeat, content: {application/json: {schema: {$ref: '#/components/schemas/OpResult'}}}}
        '400': {description: idempotency_key_required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: "amount_required, kind_invalid, counterparty_required, …", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /ops/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      tags: [ledger]
      summary: Undo an operation (soft delete)
      responses:
        '200': {description: New numbers, content: {application/json: {schema: {$ref: '#/components/schemas/FreeChange'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /debtors:
    get:
      tags: [ledger]
      summary: Customers who owe money (nasiya)
      responses:
        '200':
          description: Debtors, longest debt first
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Debtor'}}, total: {type: integer, format: int64}}}
  /debtors/{id}/repaid:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [ledger]
      summary: The debtor paid back (whole debt when amount is omitted)
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
      requestBody: {content: {application/json: {schema: {type: object, properties: {amount: {type: integer, format: int64}, method: {$ref: '#/components/schemas/Method'}}}}}}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/OpResult'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /debtors/{id}/reminder:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [ledger]
      summary: Polite reminder text in the user's language
      responses:
        '200': {description: Text, content: {application/json: {schema: {type: object, properties: {text: {type: string}}}}}}
        '404': {$ref: '#/components/responses/Error'}
  /obligations:
    get:
      tags: [ledger]
      summary: Rent, supplier, loan and other payments
      responses:
        '200': {description: List, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Obligation'}}}}}}}
    post:
      tags: [ledger]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationInput'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Obligation'}}}}
        '422': {$ref: '#/components/responses/Error'}
  /obligations/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      tags: [ledger]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationInput'}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Obligation'}}}}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [ledger]
      responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/Error'}}

  /consul/ask:
    post:
      tags: [consul]
      summary: Ask Consul (chat). Grounded in the user's ledger; numbers come from tools
      description: |
        With `Accept: text/event-stream` the answer streams: `delta` events `{"text": "..."}`, then one
        `reply` event with the full Reply. If the LLM fails, is slow (> 8 s) or a number cannot be
        verified, a template answer is returned with `fallback: true`.
        Operations mentioned in the text come back as `pending_op`; Consul never writes to the ledger.
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, maxLength: 1000, example: "kredit olsam boʻladimi?"}
                chat_id: {type: string, format: uuid, nullable: true}
                route: {type: string, description: "Current screen path without language prefix, e.g. /app/kredit", example: /app}
      responses:
        '200':
          description: Reply (JSON) or SSE stream
          content:
            application/json: {schema: {$ref: '#/components/schemas/Reply'}}
            text/event-stream: {schema: {type: string}}
        '422': {$ref: '#/components/responses/Error'}

  /voice/stt:
    post:
      tags: [voice]
      summary: Speech to text (VoiceLab). Audio is never stored or logged
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: {type: string, format: binary, description: "webm/ogg/mp4/wav, up to 60 s and 2 MB"}
                lang: {$ref: '#/components/schemas/Lang'}
      responses:
        '200': {description: Text, content: {application/json: {schema: {type: object, properties: {text: {type: string}, lang: {$ref: '#/components/schemas/Lang'}}}}}}
        '413': {description: audio_too_large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: voice_unavailable — show text input, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /voice/tts:
    post:
      tags: [voice]
      summary: Text to speech (VoiceLab), cached 24 h
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [text], properties: {text: {type: string, maxLength: 1000}, lang: {$ref: '#/components/schemas/Lang'}, speed: {type: number, minimum: 0.5, maximum: 2, default: 1}}}
      responses:
        '200': {description: Audio, content: {audio/mpeg: {schema: {type: string, format: binary}}}}
        '503': {description: voice_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

  /palata/report:
    get:
      tags: [palata]
      security: []
      summary: Anonymous statistics for the Chamber of Commerce (problem 21)
      description: Reads only precomputed snapshots. Groups with fewer than 5 entrepreneurs are never returned.
      parameters: [{name: window, in: query, schema: {type: integer, enum: [30, 90], default: 30}}]
      responses:
        '200': {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/PalataReport'}}}}
  /palata/report.csv:
    get:
      tags: [palata]
      security: []
      summary: The same report as CSV (`;` separator, UTF-8 with BOM, opens in Excel)
      parameters: [{name: window, in: query, schema: {type: integer, enum: [30, 90], default: 30}}]
      responses:
        '200': {description: CSV, content: {text/csv: {schema: {type: string}}}}

  /healthz:
    get: {tags: [user], security: [], summary: Liveness, responses: {'200': {description: ok}}}
  /readyz:
    get: {tags: [user], security: [], summary: Readiness (DB + Redis), responses: {'200': {description: ready}, '503': {description: not ready}}}

components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: access_token}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, default: 10, maximum: 100}}
    Offset: {name: offset, in: query, schema: {type: integer, default: 0}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Auth:
      description: Tokens set as HttpOnly cookies
      headers: {Set-Cookie: {schema: {type: string}, description: access_token and refresh_token}}
      content:
        application/json:
          schema: {type: object, properties: {user_id: {type: string, format: uuid}, access_token: {type: string}, expires_in: {type: integer, example: 900}}}
  schemas:
    Error:
      type: object
      description: "The frontend shows text by `code` in its own language; `message` is for logs"
      properties: {error: {type: object, required: [code, message], properties: {code: {type: string, example: amount_required}, field: {type: string, example: amount}, message: {type: string}}}}
    Lang: {type: string, enum: [uz, ru, en]}
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
        lang: {$ref: '#/components/schemas/Lang'}
    Profile:
      type: object
      properties:
        id: {type: string, format: uuid}
        phone: {type: string, nullable: true, example: "+998901234567"}
        email: {type: string, nullable: true}
        role: {type: string, enum: [user, chamber, admin]}
        lang: {$ref: '#/components/schemas/Lang'}
        prefs: {$ref: '#/components/schemas/Prefs'}
        consent_at: {type: string, format: date-time, nullable: true, description: "Required consent to personal data processing"}
        consent_version: {type: string, nullable: true}
        stats_consent_at: {type: string, format: date-time, nullable: true, description: "Voluntary consent to anonymous Chamber statistics"}
        business: {allOf: [{$ref: '#/components/schemas/Business'}], nullable: true}
        created_at: {type: string, format: date-time}
    Source: {type: object, properties: {title: {type: string}, url: {type: string}}}
    EnvelopeBase:
      type: object
      properties:
        sources: {type: array, items: {$ref: '#/components/schemas/Source'}}
        disclaimer: {type: string}

    LoanInput:
      type: object
      required: [amount, annual_rate, term_months]
      properties:
        amount: {type: number, example: 100000000, description: UZS}
        annual_rate: {type: number, example: 24, description: percent per year}
        term_months: {type: integer, example: 12}
        method: {type: string, enum: [annuity, differentiated], default: annuity}
        grace_months: {type: integer, default: 0, description: interest-only months}
    LoanEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            result:
              type: object
              properties:
                monthly_payment: {type: number, example: 9455959.66}
                first_payment: {type: number}
                last_payment: {type: number}
                total_paid: {type: number}
                total_interest: {type: number}
                overpayment_pct: {type: number}
                schedule:
                  type: array
                  items: {type: object, properties: {month: {type: integer}, payment: {type: number}, principal: {type: number}, interest: {type: number}, balance: {type: number}}}

    TaxInput:
      type: object
      required: [annual_revenue]
      properties:
        entity_type: {type: string, enum: [llc, ie], default: llc, description: "llc = MChJ/OOO, ie = YaTT/ИП"}
        regime: {type: string, enum: [auto, turnover, general], default: auto}
        annual_revenue: {type: number, example: 600000000, description: UZS excluding VAT}
        annual_expenses: {type: number, example: 300000000}
        vatable_purchases: {type: number}
        annual_payroll: {type: number, example: 120000000}
        employees: {type: integer}
    RegimeResult:
      type: object
      properties:
        regime: {type: string}
        lines:
          type: array
          items: {type: object, properties: {code: {type: string}, name: {type: string}, base: {type: number}, rate_pct: {type: number}, amount: {type: number}, article: {type: string}, note: {type: string}}}
        total_tax: {type: number}
        withheld_pit: {type: number}
        net_profit: {type: number}
        effective_rate_pct: {type: number}
    TaxEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            result:
              type: object
              properties:
                rules_version: {type: string}
                selected: {$ref: '#/components/schemas/RegimeResult'}
                alternative: {$ref: '#/components/schemas/RegimeResult'}
                recommended: {type: string, description: regime with the higher net profit}
                warnings: {type: array, items: {type: string}}

    BreakevenInput:
      type: object
      required: [price_per_unit, variable_cost_per_unit, fixed_costs_monthly]
      properties:
        initial_investment: {type: number, example: 60000000}
        fixed_costs_monthly: {type: number, example: 30000000}
        price_per_unit: {type: number, example: 25000}
        variable_cost_per_unit: {type: number, example: 10000}
        expected_units_monthly: {type: number, example: 3000}
        loan_payment_monthly: {type: number}
        revenue_tax_pct: {type: number, description: e.g. turnover tax 4}
    BreakevenEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            result:
              type: object
              properties:
                contribution_per_unit: {type: number}
                contribution_margin_pct: {type: number}
                breakeven_units_monthly: {type: number}
                breakeven_revenue_monthly: {type: number}
                monthly_profit: {type: number, nullable: true}
                margin_of_safety_pct: {type: number, nullable: true}
                payback_months: {type: integer, nullable: true}
                roi_12m_pct: {type: number, nullable: true}
                cashflow_24m: {type: array, items: {type: object, properties: {month: {type: integer}, profit: {type: number}, cumulative: {type: number}}}}
                warnings: {type: array, items: {type: string}}

    GenerateInput:
      type: object
      required: [niche, budget]
      properties:
        lang: {$ref: '#/components/schemas/Lang'}
        niche: {type: string, example: Kofe nuqtasi, maxLength: 200}
        description: {type: string, maxLength: 2000}
        region: {type: string, example: Toshkent}
        entity_type: {type: string, enum: [llc, ie]}
        budget: {type: number, example: 150000000}
        own_funds: {type: number}
        loan: {$ref: '#/components/schemas/LoanInput'}
        price_per_unit: {type: number}
        variable_cost_per_unit: {type: number}
        expected_units_monthly: {type: number}
        fixed_costs_monthly: {type: number}
        employees: {type: integer}
        avg_salary: {type: number}
    Money: {type: integer, format: int64, description: "Whole so'm"}
    OpKind:
      type: string
      enum: [sale, buy, exp, sup, nas, repaid, fix, opening]
      description: "sale; buy = purchase of goods; exp = other expense; sup = payment to a supplier (reduces the supplier obligation); nas = sale on credit; repaid = debtor paid back; fix = balance correction (signed difference); opening = starting balance"
    Method: {type: string, enum: [naqd, karta, none], description: "naqd = cash, karta = card; none for nas"}
    Sector: {type: string, enum: [dried_fruit, food, clothes, services, other]}
    Market: {type: string, enum: [chorsu, oloy, parkent, quyliq, other]}
    BizStatus: {type: string, enum: [yatt, oob, mchj, none]}
    Regime: {type: string, enum: [turnover, vat6, vat12]}
    Business:
      type: object
      required: [trade, sector, market, status, regime]
      properties:
        trade: {type: string, maxLength: 200, example: "quruq meva"}
        sector: {$ref: '#/components/schemas/Sector'}
        market: {$ref: '#/components/schemas/Market'}
        status: {$ref: '#/components/schemas/BizStatus'}
        regime: {$ref: '#/components/schemas/Regime'}
        reserve: {$ref: '#/components/schemas/Money'}
    Prefs:
      type: object
      properties:
        big_text: {type: boolean}
        voice_answers: {type: boolean}
        voice_speed: {type: number, minimum: 0.5, maximum: 2}
    Op:
      type: object
      required: [id, kind, amount, method, occurred_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/OpKind'}
        amount: {type: integer, format: int64, description: "Positive so'm; signed difference for fix"}
        method: {$ref: '#/components/schemas/Method'}
        label: {type: string}
        counterparty_id: {type: string, format: uuid, nullable: true}
        counterparty: {type: string, nullable: true}
        fiscal: {type: boolean, description: "Receipt / QR / terminal — counted as recorded turnover"}
        source: {type: string, enum: [text, voice, photo, manual, seed]}
        items: {type: array, items: {type: object, properties: {name: {type: string}, qty: {type: number}, price: {$ref: '#/components/schemas/Money'}}}}
        occurred_at: {type: string, format: date-time}
    OpInput:
      type: object
      required: [kind, amount]
      properties:
        kind: {$ref: '#/components/schemas/OpKind'}
        amount: {type: integer, format: int64, description: "For fix: the actual balance of `method` now (the server stores the difference)"}
        method: {$ref: '#/components/schemas/Method'}
        label: {type: string, maxLength: 200}
        counterparty: {type: string, maxLength: 100, description: "Customer for nas/repaid, supplier for sup/buy"}
        fiscal: {type: boolean}
        source: {type: string, enum: [text, voice, photo, manual]}
        raw_text: {type: string, maxLength: 500}
        items: {type: array, items: {type: object, properties: {name: {type: string}, qty: {type: number}, price: {$ref: '#/components/schemas/Money'}}}}
        occurred_at: {type: string, format: date-time}
    FreeChange:
      type: object
      properties:
        free_before: {$ref: '#/components/schemas/Money'}
        free_after: {$ref: '#/components/schemas/Money'}
    OpResult:
      allOf:
        - $ref: '#/components/schemas/FreeChange'
        - type: object
          properties: {op: {$ref: '#/components/schemas/Op'}}
    View:
      type: object
      properties:
        cash: {$ref: '#/components/schemas/Money'}
        naqd: {$ref: '#/components/schemas/Money'}
        karta: {$ref: '#/components/schemas/Money'}
        tax: {$ref: '#/components/schemas/Money'}
        obligations: {$ref: '#/components/schemas/Money'}
        reserve: {$ref: '#/components/schemas/Money'}
        free: {$ref: '#/components/schemas/Money'}
        profit: {$ref: '#/components/schemas/Money'}
        margin: {type: integer, description: "Percent of income"}
        owed_to_me: {$ref: '#/components/schemas/Money'}
        debtor_count: {type: integer}
        profit_3m: {$ref: '#/components/schemas/Money'}
    Upcoming:
      type: object
      properties:
        kind: {type: string, enum: [rent, supplier, loan, other, tax]}
        label: {type: string}
        amount: {$ref: '#/components/schemas/Money'}
        due_date: {type: string, format: date}
        days_left: {type: integer}
    Attention:
      type: object
      description: The frontend renders text by code and params in its own language
      properties:
        code: {type: string, enum: [debtor_overdue, tax_due, free_negative, free_low, payment_soon]}
        severity: {type: string, enum: [info, warn, alert]}
        params: {type: object, additionalProperties: true}
    MonthSummary:
      type: object
      properties:
        month: {type: string, example: "2026-11"}
        income: {$ref: '#/components/schemas/Money'}
        buy: {$ref: '#/components/schemas/Money'}
        exp: {$ref: '#/components/schemas/Money'}
        profit: {$ref: '#/components/schemas/Money'}
        margin: {type: integer}
        prev_income: {$ref: '#/components/schemas/Money'}
        prev_profit: {$ref: '#/components/schemas/Money'}
        partial: {type: boolean, description: "The month is not over yet"}
    Today:
      type: object
      properties:
        view: {$ref: '#/components/schemas/View'}
        upcoming: {type: array, items: {$ref: '#/components/schemas/Upcoming'}}
        attention: {type: array, items: {$ref: '#/components/schemas/Attention'}}
        forecast: {type: array, items: {type: object, properties: {date: {type: string, format: date}, balance: {$ref: '#/components/schemas/Money'}}}}
        month: {$ref: '#/components/schemas/MonthSummary'}
        as_of: {type: string, format: date-time}
    Intent:
      type: object
      required: [type, confirm]
      properties:
        type: {type: string, enum: [op, fix, rent, question, report, need_amount, need_kind, unknown]}
        draft: {$ref: '#/components/schemas/OpInput'}
        rent: {type: object, properties: {amount: {$ref: '#/components/schemas/Money'}, due_day: {type: integer}}}
        topic: {type: string, description: "For question: loan, tax, profit, debtors, spend, plan, …"}
        missing: {type: string, enum: [amount, kind], nullable: true}
        lang: {$ref: '#/components/schemas/Lang'}
        confirm: {type: boolean, description: "true when the amount is ≥ 1 000 000 000 — ask the user to confirm"}
    Debtor:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: string, nullable: true}
        owed: {$ref: '#/components/schemas/Money'}
        days: {type: integer, description: "Days since the oldest unpaid nasiya (FIFO)"}
    Obligation:
      allOf:
        - type: object
          properties: {id: {type: string, format: uuid}, next_due: {type: string, format: date}}
        - $ref: '#/components/schemas/ObligationInput'
    ObligationInput:
      type: object
      required: [kind, amount]
      properties:
        kind: {type: string, enum: [rent, supplier, loan, other]}
        label: {type: string, maxLength: 200}
        amount: {$ref: '#/components/schemas/Money'}
        due_day: {type: integer, minimum: 1, maximum: 31, description: "Monthly payments"}
        due_date: {type: string, format: date, description: "One-off payments"}
        recurring: {type: boolean}
        counterparty: {type: string, description: "Supplier name"}
    Reply:
      type: object
      required: [text, actions, work, sug, fallback, topic, chat_id]
      properties:
        text: {type: string, description: "Short answer; **bold** allowed"}
        card:
          type: object
          nullable: true
          properties:
            title: {type: string}
            value: {type: string}
            rows: {type: array, items: {type: array, items: {type: string}, minItems: 2, maxItems: 2}}
        actions:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              href: {type: string, description: "Path without language prefix, server allowlist"}
              cx: {type: string}
              run: {type: string}
              primary: {type: boolean}
        ask: {type: string, nullable: true, description: "One follow-up question"}
        work: {type: array, description: "How it was computed: [verified, description]", items: {type: array, items: {oneOf: [{type: boolean}, {type: string}]}}}
        sug: {type: array, items: {type: string}, description: "Suggested follow-ups"}
        fallback: {type: boolean, description: "Template answer (LLM unavailable, slow or unverified)"}
        topic: {type: string}
        pending_op: {allOf: [{$ref: '#/components/schemas/OpInput'}], nullable: true}
        chat_id: {type: string, format: uuid}
    PalataGroup:
      type: object
      properties:
        key: {type: string}
        n: {type: integer}
        unrecorded_pct: {type: integer}
        official_pct: {type: integer}
        median_turnover: {$ref: '#/components/schemas/Money'}
    PalataReport:
      type: object
      properties:
        window: {type: integer}
        period_end: {type: string, format: date}
        synthetic: {type: boolean, description: "true when demo (seed) data is included"}
        kpi:
          type: object
          properties:
            n: {type: integer}
            unrecorded_pct: {type: integer}
            unrecorded_ci_pp: {type: integer, description: "± percentage points (bootstrap)"}
            official_pct: {type: integer}
            switched_to_official: {type: integer}
            median_turnover: {$ref: '#/components/schemas/Money'}
        trend: {type: array, items: {type: object, properties: {month: {type: string}, unrecorded_pct: {type: integer}, n: {type: integer}}}}
        sectors: {type: array, items: {$ref: '#/components/schemas/PalataGroup'}}
        markets: {type: array, items: {$ref: '#/components/schemas/PalataGroup'}}
        survey: {type: object, properties: {n: {type: integer}, answers: {type: array, items: {type: object, properties: {answer: {type: string}, pct: {type: integer}}}}}}
        official: {type: object, properties: {value_pct: {type: number}, services_pct: {type: number}, period: {type: string}, source: {type: string}, note: {type: string}}}
    PhotoResult:
      type: object
      properties:
        is_document: {type: boolean, description: false if the photo is not a document}
        document_type:
          type: string
          enum: [invoice, receipt, contract, act, waybill, bank_statement, payment_order, tax_form, license, certificate, passport, id_card, power_of_attorney, price_list, letter, other]
        title: {type: string, example: "Счёт-фактура № 147 от 12.11.2026"}
        language: {type: string, description: language of the document itself, example: ru}
        text: {type: string, description: full transcription in the original language}
        fields:
          type: array
          items:
            type: object
            properties:
              key: {type: string, example: total_amount}
              label: {type: string, example: Итого к оплате}
              value: {type: string, example: "14 000 000 сум"}
        summary: {type: string}
        warnings: {type: array, items: {type: string}}
        model: {type: string, example: kimi-k3}
        disclaimer: {type: string}
    Plan:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        input: {type: object, description: anonymized wizard input}
        content: {type: string, description: Markdown plan}
        structured:
          type: object
          nullable: true
          properties:
            title: {type: string}
            summary: {type: string}
            sections: {type: array, items: {type: object, properties: {key: {type: string, enum: [market, costs, financing, taxes, breakeven]}, heading: {type: string}, body: {type: string}}}}
            key_numbers:
              type: array
              items: {type: object, properties: {label: {type: string}, value: {type: number}, unit: {type: string}, tool: {type: string}, verified: {type: boolean, description: value matches a calculator result}}}
            assumptions: {type: array, items: {type: string}}
            risks: {type: array, items: {type: string}}
            next_steps: {type: array, items: {type: string}}
        tool_calls:
          type: array
          description: Trace of calculator calls made by the LLM
          items: {type: object, properties: {name: {type: string}, arguments: {type: object}, result: {type: object}, error: {type: string}}}
        lang: {$ref: '#/components/schemas/Lang'}
        model: {type: string}
        tokens_in: {type: integer}
        tokens_out: {type: integer}
        created_at: {type: string, format: date-time}
        disclaimer: {type: string}
        sources: {type: array, items: {$ref: '#/components/schemas/Source'}}
