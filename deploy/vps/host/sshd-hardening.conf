# Managed by Consul deploy. First match wins, so this file overrides cloud-init defaults.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
# Lets a client choose the address of a reverse forward (ssh -R 172.18.0.1:1080): the voice
# tunnel binds to the Docker bridge, so only containers can reach it. Without an explicit
# address the forward still binds to loopback only.
GatewayPorts clientspecified
