# fail2ban filter: nginx limit_req violations from the finadvisor nginx container (journald).
# The stock nginx-limit-req filter expects SYSLOG_IDENTIFIER "nginx[pid]", which Docker's
# journald driver does not produce, so we match the message itself.
[Definition]
failregex   = limiting requests, excess: [\d\.]+ by zone "[^"]+", client: <HOST>,
ignoreregex =
journalmatch = CONTAINER_NAME=finadvisor-nginx-1
