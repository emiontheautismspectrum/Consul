# Production override for the VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    restart: always
    environment:
      APP_ENV: prod
      COOKIE_SECURE: "true"
    logging: &logging
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  nginx:
    restart: always
    environment:
      SSL_CERT: /etc/letsencrypt/live/${DOMAIN}/fullchain.pem
      SSL_KEY: /etc/letsencrypt/live/${DOMAIN}/privkey.pem
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    # Reload every 12h to pick up renewed certificates.
    command: ["/bin/sh", "-c", "/docker-entrypoint.sh nginx -g 'daemon off;' & while :; do sleep 12h; nginx -s reload; done"]
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  postgres: {restart: always, logging: *logging}
  pgbouncer: {restart: always}
  redis: {restart: always}

volumes:
  letsencrypt:
