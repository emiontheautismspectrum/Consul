# Local / base stack. One command: `make up`.
name: finadvisor

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Connection pooler in transaction mode: the app talks only to PgBouncer, which caps the
  # number of real PostgreSQL connections.
  pgbouncer:
    <<: *restart
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      LISTEN_PORT: 6432
    depends_on:
      postgres: {condition: service_healthy}

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *restart
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      pgbouncer: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Next.js frontend (SSR, standalone), served by nginx at /.
  web:
    <<: *restart
    build: ./frontend
    image: consul-web:local

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_CERT: ${SSL_CERT:-/etc/nginx/certs/fullchain.pem}
      SSL_KEY: ${SSL_KEY:-/etc/nginx/certs/privkey.pem}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|SSL_)"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  certbot-www:
